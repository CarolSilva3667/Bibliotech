</nav>


</header>

<section class="emprestimos">


<h2>Controle de Empréstimos</h2>

<table>

    <thead>

        <tr>

            <th>Aluno</th>

            <th>Livro</th>

            <th>Empréstimo</th>

            <th>Devolução</th>

            <th>Status</th>

            <th>Ação</th>

        </tr>

    </thead>

    <tbody id="listaEmprestimos">

    </tbody>

</table>


</section>

<script src="script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async function () {
    const tipo = localStorage.getItem("tipoUsuario");

    if (tipo !== "bibliotecario") {
        alert("Acesso permitido apenas para bibliotecários.");
        window.location.href = "login.html";
        return;
    }

    const tabela = document.getElementById("listaEmprestimos");

    try {
        const resposta = await fetch("http://localhost:3000/emprestimos");

        if (!resposta.ok) {
            throw new Error("Erro ao buscar empréstimos.");
        }

        const emprestimos = (await resposta.json()).filter(
            emprestimo => emprestimo.status === "Emprestado"
        );

        if (emprestimos.length === 0) {
            tabela.innerHTML = `
                <tr>
                    <td colspan="6">
                        Nenhum livro emprestado no momento.
                    </td>
                </tr>
            `;
            return;
        }

        emprestimos.forEach(function (emprestimo) {
            const linha = document.createElement("tr");

            linha.innerHTML = `
                <td>${emprestimo.aluno}</td>
                <td>${emprestimo.livro}</td>
                <td>${emprestimo.dataEmprestimo}</td>
                <td>${emprestimo.dataDevolucao}</td>
                <td class="ok">
                    📖 ${emprestimo.status}
                </td>
                <td>
                    <button onclick="devolverLivro(${emprestimo.id})">
                        Devolvido
                    </button>
                </td>
            `;

            tabela.appendChild(linha);
        });

    } catch (erro) {
        console.error("Erro ao carregar empréstimos:", erro);

        tabela.innerHTML = `
            <tr>
                <td colspan="6">
                    Erro ao carregar os empréstimos.
                </td>
            </tr>
        `;
    }
});
</script>

</body>

</html>
